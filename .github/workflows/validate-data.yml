name: Validate data

on:
  push:
    paths: ['data/**', '.github/workflows/validate-data.yml']
  pull_request:
    paths: ['data/**', '.github/workflows/validate-data.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validators
        run: npm install --no-save --no-package-lock @jsonresume/schema@1.3.1 ajv-cli@5 ajv-formats@2

      - name: Validate resume.json against the JSON Resume schema
        run: npx ajv validate --spec=draft7 -c ajv-formats -s node_modules/@jsonresume/schema/schema.json -d data/resume.json

      - name: Check site.json syntax
        run: node -e "JSON.parse(require('fs').readFileSync('data/site.json', 'utf8'))"
